<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Tasks</title>
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #2b2b29;
      --muted: #9a958c;
      --border: #eceae5;
      --accent: #4a5568;
      --error: #c2554d;
      --shadow: 0 1px 2px rgba(60, 50, 40, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 340px;
    }
    h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0.25rem 0 1.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input {
      width: 100%;
      font-size: 16px;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 1rem;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      padding: 0.65rem;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: default; }
    .err {
      color: var(--error);
      font-size: 0.82rem;
      margin-bottom: 0.9rem;
      min-height: 1.1rem;
    }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Tasks</h1>
    <p class="sub">Sign in to continue</p>

    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" autofocus />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" />

    <div class="err" id="err"></div>
    <button type="submit" id="btn">Sign in</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) {
        window.location.href = "/";
      } else {
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || "Sign in failed";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
