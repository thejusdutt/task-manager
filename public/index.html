<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --col: #ebecf0;
      --text: #172b4d;
      --muted: #6b778c;
      --border: #dfe1e6;
      --accent: #4a5568;
      --high: #c2554d;
      --low: #c9c4ba;
      --shadow: 0 1px 1px rgba(9, 30, 66, 0.13);
      --shadow-drag: 0 6px 14px rgba(9, 30, 66, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }

    header { margin-bottom: 1.5rem; }
    .head-row { display: flex; align-items: baseline; justify-content: space-between; }
    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .signout { color: var(--muted); font-size: 0.8rem; text-decoration: none; transition: color 0.15s; }
    .signout:hover { color: var(--text); }

    /* Add form */
    .add {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 0.5rem 0.9rem 0.9rem;
      margin-bottom: 1.75rem;
    }
    .add-row { display: flex; gap: 0.5rem; }
    .add input[type="text"] {
      flex: 1;
      border: none;
      font-size: 16px;
      padding: 0.65rem 0.3rem;
      background: transparent;
      color: var(--text);
    }
    .add input[type="text"]::placeholder { color: var(--muted); }
    .add input[type="text"]:focus { outline: none; }
    .add-meta { display: flex; gap: 0.5rem; align-items: center; }
    select, input[type="date"] {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.35rem 0.55rem;
      font-size: 16px;
      background: var(--bg);
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
    }
    select:focus, input[type="date"]:focus { outline: none; border-color: var(--accent); }
    button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; font-size: 0.9rem; }
    .btn-add {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      padding: 0.45rem 1.1rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.88; }
    .btn-add:disabled { opacity: 0.4; cursor: default; }

    /* Board */
    .board {
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    .col {
      flex: 1 1 0;
      min-width: 0;
      background: var(--col);
      border-radius: 12px;
      padding: 0.6rem 0.6rem 0.75rem;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .col.drop-target { background: #dce0e6; box-shadow: inset 0 0 0 2px var(--accent); }
    .col-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.25rem 0.4rem 0.6rem;
    }
    .col-title { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    /* Small status dot before each column title (Jira-style colour coding). */
    .col-title::before {
      content: ""; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      margin-right: 0.45rem; vertical-align: middle;
      background: var(--muted);
    }
    .col[data-status="backlog"] .col-title::before { background: #8993a4; }
    .col[data-status="todo"]    .col-title::before { background: #4c9aff; }
    .col[data-status="doing"]   .col-title::before { background: #ffab00; }
    .col[data-status="revisit"] .col-title::before { background: #6554c0; }
    .col[data-status="done"]    .col-title::before { background: #36b37e; }
    .col-count {
      font-size: 0.72rem; color: var(--muted);
      background: rgba(9, 30, 66, 0.08);
      border-radius: 10px; padding: 0.05rem 0.45rem; min-width: 1.4rem; text-align: center;
    }
    .col-body { list-style: none; min-height: 40px; display: flex; flex-direction: column; gap: 0.5rem; }
    .col-empty {
      color: var(--muted); font-size: 0.76rem; text-align: center;
      padding: 1.1rem 0; opacity: 0.6;
      border: 1.5px dashed var(--border); border-radius: 8px;
    }
    .col.drop-target .col-empty { border-color: var(--accent); opacity: 0.9; }

    /* Card */
    .card {
      background: var(--card);
      border-radius: 9px;
      box-shadow: var(--shadow);
      padding: 0.6rem 0.7rem;
      cursor: grab;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .card:hover { box-shadow: 0 3px 8px rgba(9, 30, 66, 0.16); transform: translateY(-1px); }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.45; transform: rotate(1.5deg); box-shadow: var(--shadow-drag); }
    /* High-priority cards get a quiet red accent stripe down the left edge. */
    .card.p-high { border-left: 3px solid var(--high); padding-left: calc(0.7rem - 3px); }
    .card.s-done { opacity: 0.78; }
    .card.s-done .title span { text-decoration: line-through; color: var(--muted); }

    .card-head { display: flex; align-items: flex-start; gap: 0.4rem; }
    .title { font-size: 0.9rem; word-break: break-word; display: flex; align-items: center; gap: 0.45rem; flex: 1; min-width: 0; }
    .dot { width: 7px; height: 7px; min-width: 7px; border-radius: 50%; }
    .p-high .dot { background: var(--high); }
    .p-low .dot { background: var(--low); }
    .notes { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; word-break: break-word; }
    .sub { display: flex; gap: 0.6rem; margin-top: 0.4rem; font-size: 0.74rem; color: var(--muted); flex-wrap: wrap; align-items: center; }
    .due { background: rgba(9, 30, 66, 0.06); border-radius: 6px; padding: 0.05rem 0.4rem; }
    .due.overdue { color: #fff; background: var(--high); }

    /* Per-card status picker: a touch-friendly alternative to drag-and-drop.
       Desktop devices drag cards between columns, so it's hidden there to keep
       the board clean. On touch devices (no hover) HTML5 drag never fires, so
       this becomes the primary way to move a card. */
    .move-status {
      display: none;
      margin-left: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.1rem 0.3rem;
      font-size: 0.74rem;
      background: var(--bg);
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
    }
    @media (hover: none) {
      .move-status { display: inline-block; }
    }
    /* A card with no due date has nothing else in its sub row, so on desktop
       (where the picker is hidden) collapse the empty row to avoid a stray gap. */
    @media (hover: hover) {
      .sub.sub-bare { display: none; }
    }

    .card-actions { display: flex; gap: 0.1rem; opacity: 0; transition: opacity 0.15s; }
    .card:hover .card-actions { opacity: 1; }
    @media (hover: none) { .card-actions { opacity: 1; } }
    .icon-btn { background: transparent; color: var(--muted); font-size: 0.95rem; line-height: 1; padding: 0.1rem 0.25rem; transition: color 0.15s; }
    .icon-btn:hover { color: var(--text); }
    .del:hover { color: var(--high); }

    /* Inline edit (replaces a card while editing) */
    .card.editing { cursor: default; }
    .edit { display: flex; flex-direction: column; gap: 0.5rem; }
    .edit input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
    }
    .edit input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .edit-title { font-weight: 500; }
    .edit-meta { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .edit-meta select, .edit-meta input[type="date"] { color: var(--text); font-size: 0.8rem; padding: 0.3rem 0.4rem; }
    .edit-actions { display: flex; gap: 0.4rem; }
    .btn-save { background: var(--accent); color: #fff; padding: 0.4rem 0.9rem; font-weight: 500; transition: opacity 0.15s; }
    .btn-save:hover { opacity: 0.88; }
    .btn-cancel { background: transparent; color: var(--muted); padding: 0.4rem 0.7rem; }
    .btn-cancel:hover { color: var(--text); }

    /* Below this width five equal columns get too cramped, so let them keep a
       readable minimum and bring back horizontal scroll. */
    @media (max-width: 900px) {
      .col { min-width: 220px; }
    }

    @media (max-width: 640px) {
      body { padding: 1rem 0.75rem; }
      .add-meta { flex-wrap: wrap; }
      .add-meta select, .add-meta input[type="date"] { flex: 1; min-width: 0; }
      .btn-add { margin-left: 0; flex-basis: 100%; order: 3; padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head-row">
        <h1>Tasks</h1>
        <a href="/api/logout" class="signout">Sign out</a>
      </div>
      <p id="summary"></p>
    </header>

    <form class="add" id="addForm">
      <div class="add-row">
        <input type="text" id="title" placeholder="Add a task…" autocomplete="off" />
      </div>
      <div class="add-meta">
        <select id="priority" title="Priority">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
        </select>
        <input type="date" id="due" title="Due date" />
        <button type="submit" class="btn-add" id="addBtn">Add</button>
      </div>
    </form>

    <div class="board" id="board">
      <section class="col" data-status="backlog">
        <header class="col-head"><span class="col-title">Backlog</span><span class="col-count">0</span></header>
        <ul class="col-body"></ul>
      </section>
      <section class="col" data-status="todo">
        <header class="col-head"><span class="col-title">To Do</span><span class="col-count">0</span></header>
        <ul class="col-body"></ul>
      </section>
      <section class="col" data-status="doing">
        <header class="col-head"><span class="col-title">In Progress</span><span class="col-count">0</span></header>
        <ul class="col-body"></ul>
      </section>
      <section class="col" data-status="revisit">
        <header class="col-head"><span class="col-title">To Be Revisited</span><span class="col-count">0</span></header>
        <ul class="col-body"></ul>
      </section>
      <section class="col" data-status="done">
        <header class="col-head"><span class="col-title">Done</span><span class="col-count">0</span></header>
        <ul class="col-body"></ul>
      </section>
    </div>
  </div>

  <script>
    const api = {
      list:   ()         => fetch("/api/tasks").then(r => r.json()),
      create: (data)     => fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) }).then(r => r.json()),
      update: (id, data) => fetch(`/api/tasks/${id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(data) }).then(r => r.json()),
      remove: (id)       => fetch(`/api/tasks/${id}`, { method: "DELETE" }).then(r => r.json()),
    };

    const STATUSES = ["backlog", "todo", "doing", "revisit", "done"];

    let tasks = [];
    let editingId = null;
    let draggingId = null;

    const board = document.getElementById("board");
    const el = {
      summary: document.getElementById("summary"),
      form: document.getElementById("addForm"),
      title: document.getElementById("title"),
      priority: document.getElementById("priority"),
      due: document.getElementById("due"),
      addBtn: document.getElementById("addBtn"),
    };

    const todayISO = () => new Date().toISOString().slice(0, 10);

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function fmtDate(d) {
      if (!d) return "";
      const dt = new Date(d + "T00:00:00");
      return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function statusOptions(current) {
      const labels = { backlog: "Backlog", todo: "To Do", doing: "In Progress", revisit: "To Be Revisited", done: "Done" };
      return STATUSES.map(s =>
        `<option value="${s}" ${s === current ? "selected" : ""}>${labels[s]}</option>`
      ).join("");
    }

    function editCard(t) {
      return `
        <li class="card editing" data-id="${t.id}">
          <form class="edit">
            <input type="text" class="edit-title" value="${esc(t.title)}" placeholder="Task title" />
            <input type="text" class="edit-notes" value="${esc(t.notes)}" placeholder="Notes (optional)" />
            <div class="edit-meta">
              <select class="edit-priority" title="Priority">
                <option value="low" ${t.priority === "low" ? "selected" : ""}>Low</option>
                <option value="normal" ${t.priority === "normal" ? "selected" : ""}>Normal</option>
                <option value="high" ${t.priority === "high" ? "selected" : ""}>High</option>
              </select>
              <select class="edit-status" title="Status">${statusOptions(t.status)}</select>
              <input type="date" class="edit-due" title="Due date" value="${t.due_date || ""}" />
            </div>
            <div class="edit-actions">
              <button type="submit" class="btn-save">Save</button>
              <button type="button" class="btn-cancel">Cancel</button>
            </div>
          </form>
        </li>`;
    }

    function viewCard(t) {
      const overdue = t.due_date && t.status !== "done" && t.due_date < todayISO();
      const dot = t.priority !== "normal" ? `<span class="dot" title="${t.priority} priority"></span>` : "";
      const due = t.due_date
        ? `<span class="due ${overdue ? "overdue" : ""}">${overdue ? "Overdue · " : ""}${fmtDate(t.due_date)}</span>`
        : "";
      // The sub row always carries the touch-only status picker; mark it "bare"
      // when there's no due date so desktop can collapse the otherwise-empty row.
      return `
        <li class="card p-${t.priority} s-${t.status}" draggable="true" data-id="${t.id}">
          <div class="card-head">
            <div class="title">${dot}<span>${esc(t.title)}</span></div>
            <div class="card-actions">
              <button class="icon-btn edit-btn" title="Edit" type="button">✎</button>
              <button class="icon-btn del" title="Delete" type="button">×</button>
            </div>
          </div>
          ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ""}
          <div class="sub${t.due_date ? "" : " sub-bare"}">
            ${due}
            <select class="move-status" aria-label="Move task to column">${statusOptions(t.status)}</select>
          </div>
        </li>`;
    }

    function render() {
      board.querySelectorAll(".col").forEach(col => {
        const status = col.dataset.status;
        const items = tasks.filter(t => t.status === status);
        const body = col.querySelector(".col-body");
        body.innerHTML = items.length
          ? items.map(t => (t.id === editingId ? editCard(t) : viewCard(t))).join("")
          : `<li class="col-empty">Drop here</li>`;
        col.querySelector(".col-count").textContent = items.length;
      });

      if (editingId != null) {
        const input = board.querySelector(".edit-title");
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }

      const open = tasks.filter(t => t.status !== "done").length;
      el.summary.textContent = tasks.length === 0
        ? "No tasks yet"
        : `${open} open · ${tasks.length} total`;
    }

    async function load() {
      tasks = await api.list();
      render();
    }

    // --- add ---
    el.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = el.title.value.trim();
      if (!title) return;
      el.addBtn.disabled = true;
      await api.create({
        title,
        priority: el.priority.value,
        due_date: el.due.value || null,
      });
      el.title.value = "";
      el.due.value = "";
      el.priority.value = "normal";
      el.addBtn.disabled = false;
      el.title.focus();
      await load();
    });

    // --- card actions (edit / delete / cancel) ---
    board.addEventListener("click", async (e) => {
      const cardEl = e.target.closest(".card");
      if (!cardEl) return;
      const id = Number(cardEl.dataset.id);

      if (e.target.classList.contains("edit-btn")) {
        editingId = id;
        render();
      } else if (e.target.classList.contains("del")) {
        await api.remove(id);
        tasks = tasks.filter(t => t.id !== id);
        render();
      } else if (e.target.classList.contains("btn-cancel")) {
        editingId = null;
        render();
      }
    });

    // --- save inline edit ---
    board.addEventListener("submit", async (e) => {
      e.preventDefault();
      const cardEl = e.target.closest(".card");
      if (!cardEl) return;
      const id = Number(cardEl.dataset.id);
      const title = cardEl.querySelector(".edit-title").value.trim();
      if (!title) { cardEl.querySelector(".edit-title").focus(); return; }
      await api.update(id, {
        title,
        notes: cardEl.querySelector(".edit-notes").value.trim(),
        priority: cardEl.querySelector(".edit-priority").value,
        status: cardEl.querySelector(".edit-status").value,
        due_date: cardEl.querySelector(".edit-due").value || null,
      });
      editingId = null;
      await load();
    });

    // --- move via the per-card status picker (touch-friendly; see .move-status) ---
    board.addEventListener("change", async (e) => {
      if (!e.target.classList.contains("move-status")) return;
      const cardEl = e.target.closest(".card");
      if (!cardEl) return;
      const id = Number(cardEl.dataset.id);
      const status = e.target.value;
      const task = tasks.find(t => t.id === id);
      if (!task || task.status === status) return;
      task.status = status;        // optimistic move
      render();
      await api.update(id, { status });
      await load();
    });

    // --- drag and drop between columns ---
    board.addEventListener("dragstart", (e) => {
      const cardEl = e.target.closest(".card");
      if (!cardEl || cardEl.classList.contains("editing")) return;
      draggingId = Number(cardEl.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", String(draggingId));
      // Defer so the drag image is captured before the card dims.
      requestAnimationFrame(() => cardEl.classList.add("dragging"));
    });

    board.addEventListener("dragend", () => {
      draggingId = null;
      board.querySelectorAll(".dragging").forEach(c => c.classList.remove("dragging"));
      board.querySelectorAll(".drop-target").forEach(c => c.classList.remove("drop-target"));
    });

    board.addEventListener("dragover", (e) => {
      const col = e.target.closest(".col");
      if (!col || draggingId == null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      board.querySelectorAll(".col.drop-target").forEach(c => { if (c !== col) c.classList.remove("drop-target"); });
      col.classList.add("drop-target");
    });

    board.addEventListener("drop", async (e) => {
      const col = e.target.closest(".col");
      if (!col) return;
      e.preventDefault();
      col.classList.remove("drop-target");
      const id = Number(e.dataTransfer.getData("text/plain")) || draggingId;
      const status = col.dataset.status;
      const task = tasks.find(t => t.id === id);
      if (!task || task.status === status) return;
      task.status = status;        // optimistic move
      render();
      await api.update(id, { status });
      await load();
    });

    load();
  </script>
</body>
</html>
